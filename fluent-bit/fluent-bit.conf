# Fluent Bit: legge il file NDJSON scritto da replay.py e pubblica ogni riga sul topic Kafka "appalti".

[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /stream/appalti.ndjson
    Tag               appalti
    Parser            json
    # Ricorda fin dove ha letto: se il container riparte non rimanda le righe gia' inviate
    DB                /stream/fluentbit-appalti.db
    # Legge anche le righe scritte prima che Fluent Bit partisse
    Read_from_Head    On
    Refresh_Interval  2
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

[OUTPUT]
    Name               kafka
    Match              appalti
    Brokers            kafka:9092
    Topics             appalti
    Format             json
    # La chiave del messaggio Kafka e' l'id della gara: stessa gara -> stessa partizione
    Message_Key_Field  id_gara
    # Fluent Bit aggiunge un timestamp: lo chiamiamo fb_time per non confonderlo con @timestamp
    Timestamp_Key      fb_time
    rdkafka.queue.buffering.max.ms  200
